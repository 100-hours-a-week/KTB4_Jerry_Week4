x-backend: &backend
  env_file:
    - .env
  environment:
    SPRING_PROFILES_ACTIVE: prod
    REDIS_HOST: redis
  stop_grace_period: 40s
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 120s

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active:/etc/nginx/active:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    image: nginxinc/nginx-unprivileged:alpine3.22
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/nginx.conf:ro
      - ./fe-data:/srv/fe:ro
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend-blue:
    <<: *backend
    container_name: backend-blue
    image: jerryhy/talktalk-backend:${BLUE_TAG:-latest}
  backend-green:
    <<: *backend
    container_name: backend-green
    image: jerryhy/talktalk-backend:${GREEN_TAG:-latest}
